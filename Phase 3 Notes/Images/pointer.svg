<svg xmlns="http://www.w3.org/2000/svg" width="740" height="240" viewBox="0 0 740 240">
<rect x="1" y="1" width="738" height="238" rx="12" fill="#FBFCFD" stroke="#D5DAE0"/>
<text xml:space="preserve" x="370.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">A pointer is a variable that holds an address</text>
<text xml:space="preserve" x="370" y="62" font-family="Consolas,Menlo,monospace" font-size="15" text-anchor="middle" fill="#1F2933" font-weight="700">int age = 20;     int *p = &amp;age;</text>
<rect x="120" y="100" width="180" height="70" rx="6" fill="#FDE9D3" stroke="#D97A1E" stroke-width="1.6"/>
<text xml:space="preserve" x="210.0" y="133.3" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">p</text>
<text xml:space="preserve" x="210.0" y="150.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">holds 0x1000</text>
<text xml:space="preserve" x="210" y="188" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#5B6672">address 0x2000</text>
<rect x="440" y="100" width="180" height="70" rx="6" fill="#DCEBFA" stroke="#2F6FB0" stroke-width="1.6"/>
<text xml:space="preserve" x="530.0" y="133.3" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">age</text>
<text xml:space="preserve" x="530.0" y="150.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">holds 20</text>
<text xml:space="preserve" x="530" y="188" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#5B6672">address 0x1000</text>
<line x1="300" y1="135" x2="438" y2="135" stroke="#D97A1E" stroke-width="2.8"/>
<polygon points="438.0,135.0 429.9,138.9 429.9,131.1" fill="#D97A1E"/>
<text xml:space="preserve" x="370" y="222" font-family="Consolas,Menlo,monospace" font-size="13" text-anchor="middle" fill="#1F2933">&amp;age means the address of age.   *p means the value at that address.</text>
</svg>
