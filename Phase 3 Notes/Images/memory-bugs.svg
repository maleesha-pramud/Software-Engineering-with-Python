<svg xmlns="http://www.w3.org/2000/svg" width="780" height="240" viewBox="0 0 780 240">
<rect x="1" y="1" width="778" height="238" rx="12" fill="#FBFCFD" stroke="#D5DAE0"/>
<text xml:space="preserve" x="390.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">Three classic memory bugs</text>
<rect x="25" y="66" width="230" height="70" rx="6" fill="#FDE9D3" stroke="#D97A1E" stroke-width="1.6"/>
<text xml:space="preserve" x="140.0" y="98.25" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1F2933" font-weight="700">Memory leak</text>
<text xml:space="preserve" x="140.0" y="116.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">you never call free</text>
<text xml:space="preserve" x="140" y="164" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933">Used memory keeps</text>
<text xml:space="preserve" x="140" y="184" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933">growing until a crash</text>
<rect x="275" y="66" width="230" height="70" rx="6" fill="#FBE0E0" stroke="#C94343" stroke-width="1.6"/>
<text xml:space="preserve" x="390.0" y="98.25" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1F2933" font-weight="700">Dangling pointer</text>
<text xml:space="preserve" x="390.0" y="116.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">using freed memory</text>
<text xml:space="preserve" x="390" y="164" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933">The pointer still points</text>
<text xml:space="preserve" x="390" y="184" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933">to a place now gone</text>
<rect x="525" y="66" width="230" height="70" rx="6" fill="#EAE3F8" stroke="#7452B8" stroke-width="1.6"/>
<text xml:space="preserve" x="640.0" y="98.25" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1F2933" font-weight="700">Buffer overflow</text>
<text xml:space="preserve" x="640.0" y="116.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">writing past the end</text>
<text xml:space="preserve" x="640" y="164" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933">Overwrites its neighbours,</text>
<text xml:space="preserve" x="640" y="184" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933">and is a security hole</text>
<text xml:space="preserve" x="390" y="222" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#5B6672">Languages with garbage collection or ownership rules prevent most of these.</text>
</svg>
