<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
<rect x="1" y="1" width="758" height="298" rx="12" fill="#FBFCFD" stroke="#D5DAE0"/>
<text xml:space="preserve" x="380.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">The CPU repeats one loop, billions of times a second</text>
<rect x="25" y="60" width="190" height="60" rx="6" fill="#DCEBFA" stroke="#2F6FB0" stroke-width="1.6"/>
<text xml:space="preserve" x="120.0" y="86.9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">1. Fetch</text>
<text xml:space="preserve" x="120.0" y="105.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">get the next instruction</text>
<rect x="25" y="185" width="190" height="60" rx="6" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="120.0" y="211.9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">3. Execute</text>
<text xml:space="preserve" x="120.0" y="230.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">do it, save the result</text>
<rect x="245" y="120" width="190" height="60" rx="6" fill="#FDE9D3" stroke="#D97A1E" stroke-width="1.6"/>
<text xml:space="preserve" x="340.0" y="146.9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">2. Decode</text>
<text xml:space="preserve" x="340.0" y="165.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">work out what it means</text>
<line x1="215" y1="90" x2="245" y2="125" stroke="#1F2933" stroke-width="1.8"/>
<polygon points="245.0,125.0 236.8,121.4 242.7,116.3" fill="#1F2933"/>
<line x1="245" y1="175" x2="215" y2="215" stroke="#1F2933" stroke-width="1.8"/>
<polygon points="215.0,215.0 216.7,206.2 223.0,210.9" fill="#1F2933"/>
<line x1="120" y1="185" x2="120" y2="122" stroke="#1F2933" stroke-width="1.8"/>
<polygon points="120.0,122.0 123.9,130.1 116.1,130.1" fill="#1F2933"/>
<text xml:space="preserve" x="560" y="66" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">Memory holds the program</text>
<rect x="470" y="80" width="60" height="36" rx="1" fill="#EEF0F3" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="500.0" y="102.2" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="700">100</text>
<rect x="530" y="80" width="190" height="36" rx="1" fill="#FFFFFF" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="625.0" y="102.55" font-family="Consolas,Menlo,monospace" font-size="13" text-anchor="middle" fill="#1F2933">LOAD R1, 7</text>
<rect x="470" y="120" width="60" height="36" rx="1" fill="#EEF0F3" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="500.0" y="142.2" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="700">104</text>
<rect x="530" y="120" width="190" height="36" rx="1" fill="#FFFFFF" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="625.0" y="142.55" font-family="Consolas,Menlo,monospace" font-size="13" text-anchor="middle" fill="#1F2933">LOAD R2, 5</text>
<rect x="470" y="160" width="60" height="36" rx="1" fill="#EEF0F3" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="500.0" y="182.2" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="700">108</text>
<rect x="530" y="160" width="190" height="36" rx="1" fill="#FFF4C2" stroke="#B58900" stroke-width="1.6"/>
<text xml:space="preserve" x="625.0" y="182.55" font-family="Consolas,Menlo,monospace" font-size="13" text-anchor="middle" fill="#1F2933">ADD R3, R1, R2</text>
<rect x="470" y="200" width="60" height="36" rx="1" fill="#EEF0F3" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="500.0" y="222.2" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="700">112</text>
<rect x="530" y="200" width="190" height="36" rx="1" fill="#FFFFFF" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="625.0" y="222.55" font-family="Consolas,Menlo,monospace" font-size="13" text-anchor="middle" fill="#1F2933">STORE R3, [200]</text>
<line x1="445" y1="225" x2="468" y2="184" stroke="#D97A1E" stroke-width="1.8"/>
<polygon points="468.0,184.0 467.4,193.0 460.6,189.2" fill="#D97A1E"/>
<text xml:space="preserve" x="462" y="244" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="end" fill="#D97A1E" font-weight="700">instruction pointer</text>
<text xml:space="preserve" x="380" y="285" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933">The instruction pointer always holds the address of the next instruction.</text>
</svg>
