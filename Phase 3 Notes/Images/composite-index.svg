<text xml:space="preserve" x="90.0" y="100.2" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="700">last</text>
<rect x="140" y="80" width="100" height="32" rx="1" fill="#EEF0F3" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="190.0" y="100.2" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="700">first</text>
<rect x="40" y="112" width="100" height="32" rx="1" fill="#FFFFFF" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="90.0" y="132.2" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933">Doe</text>
<rect x="140" y="112" width="100" height="32" rx="1" fill="#FFFFFF" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="190.0" y="132.2" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933">Ann</text>
<rect x="40" y="144" width="100" height="32" rx="1" fill="#FFFFFF" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="90.0" y="164.2" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933">Doe</text>
<rect x="140" y="144" width="100" height="32" rx="1" fill="#FFFFFF" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="190.0" y="164.2" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933">Sam</text>
<rect x="40" y="176" width="100" height="32" rx="1" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="90.0" y="196.2" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933">Khan</text>
<rect x="140" y="176" width="100" height="32" rx="1" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="190.0" y="196.2" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933">Ali</text>
<rect x="40" y="208" width="100" height="32" rx="1" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="90.0" y="228.2" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933">Khan</text>
<rect x="140" y="208" width="100" height="32" rx="1" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="190.0" y="228.2" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933">Mei</text>
<rect x="40" y="240" width="100" height="32" rx="1" fill="#FFFFFF" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="90.0" y="260.2" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933">Silva</text>
<rect x="140" y="240" width="100" height="32" rx="1" fill="#FFFFFF" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="190.0" y="260.2" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933">Ann</text>
<text xml:space="preserve" x="270" y="72" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#1F2933"></text>
<rect x="275" y="88" width="300" height="44" rx="6" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="425.0" y="113.85" font-family="Consolas,Menlo,monospace" font-size="11" text-anchor="middle" fill="#1F2933" font-weight="700">WHERE last = &#x27;Khan&#x27;</text>
<text xml:space="preserve" x="585" y="115" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#1F2933">Jumps straight there</text>
<rect x="275" y="150" width="300" height="44" rx="6" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="425.0" y="175.85" font-family="Consolas,Menlo,monospace" font-size="11" text-anchor="middle" fill="#1F2933" font-weight="700">WHERE last = &#x27;Khan&#x27; AND first = &#x27;Ali&#x27;</text>
<text xml:space="preserve" x="585" y="177" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#1F2933">Even more exact</text>
<rect x="275" y="212" width="300" height="44" rx="6" fill="#FBE0E0" stroke="#C94343" stroke-width="1.6"/>
<text xml:space="preserve" x="425.0" y="237.85" font-family="Consolas,Menlo,monospace" font-size="11" text-anchor="middle" fill="#1F2933" font-weight="700">WHERE first = &#x27;Ali&#x27;</text>
<text xml:space="preserve" x="585" y="239" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#1F2933">Must read the whole book</text>
<text xml:space="preserve" x="390" y="298" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">Left-prefix rule: an index helps only if your query uses its columns from the left.</text>
</svg>
