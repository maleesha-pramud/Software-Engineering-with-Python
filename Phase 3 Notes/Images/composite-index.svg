<svg xmlns="http://www.w3.org/2000/svg" width="780" height="315" viewBox="0 0 780 315">
<rect x="1" y="1" width="778" height="313" rx="12" fill="#FBFCFD" stroke="#D5DAE0"/>
<text xml:space="preserve" x="390.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">A composite index works like a phone book: last name, then first name</text>
<text xml:space="preserve" x="140.0" y="72" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">INDEX (last, first)</text>
