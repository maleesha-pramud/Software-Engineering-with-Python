<text xml:space="preserve" x="385" y="250" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933">The CPU works. RAM is its desk. The disk is its filing cabinet.</text>
