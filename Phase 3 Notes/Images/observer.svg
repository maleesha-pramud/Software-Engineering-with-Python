<text xml:space="preserve" x="380" y="246" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933">The publisher doesn&#x27;t know who&#x27;s listening, so adding a listener changes nothing.</text>
