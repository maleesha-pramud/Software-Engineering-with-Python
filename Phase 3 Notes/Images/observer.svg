<svg xmlns="http://www.w3.org/2000/svg" width="760" height="262" viewBox="0 0 760 262">
<rect x="1" y="1" width="758" height="260" rx="12" fill="#FBFCFD" stroke="#D5DAE0"/>
<text xml:space="preserve" x="380.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">Observer: one event, and everyone who subscribed hears it</text>
