<svg xmlns="http://www.w3.org/2000/svg" width="780" height="260" viewBox="0 0 780 260">
<rect x="1" y="1" width="778" height="258" rx="12" fill="#FBFCFD" stroke="#D5DAE0"/>
<text xml:space="preserve" x="390.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">Never store passwords. Store a slow, salted hash.</text>
<rect x="25" y="62" width="250" height="52" rx="6" fill="#FBE0E0" stroke="#C94343" stroke-width="1.6"/>
<text xml:space="preserve" x="150.0" y="92.55" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">Plain text</text>
<rect x="275" y="62" width="170" height="52" rx="1" fill="#FFFFFF" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="360.0" y="91.85" font-family="Consolas,Menlo,monospace" font-size="11" text-anchor="middle" fill="#1F2933">hunter2</text>
<text xml:space="preserve" x="458" y="93" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#1F2933">A leak exposes everyone</text>
<rect x="25" y="124" width="250" height="52" rx="6" fill="#FDE9D3" stroke="#D97A1E" stroke-width="1.6"/>
<text xml:space="preserve" x="150.0" y="154.55" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">Fast hash (SHA-256)</text>
<rect x="275" y="124" width="170" height="52" rx="1" fill="#FFFFFF" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="360.0" y="153.85" font-family="Consolas,Menlo,monospace" font-size="11" text-anchor="middle" fill="#1F2933">f52fbd32...</text>
<text xml:space="preserve" x="458" y="155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#1F2933">Attackers can try billions per second</text>
<rect x="25" y="186" width="250" height="52" rx="6" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="150.0" y="216.55" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">Salted slow hash (Argon2, scrypt)</text>
<rect x="275" y="186" width="170" height="52" rx="1" fill="#FFFFFF" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="360.0" y="215.85" font-family="Consolas,Menlo,monospace" font-size="11" text-anchor="middle" fill="#1F2933">$scrypt$salt$9f2a...</text>
<text xml:space="preserve" x="458" y="217" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#1F2933">Too slow to guess, and unique for each user</text>
</svg>
