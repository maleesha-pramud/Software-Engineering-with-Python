<svg xmlns="http://www.w3.org/2000/svg" width="780" height="340" viewBox="0 0 780 340">
<rect x="1" y="1" width="778" height="338" rx="12" fill="#FBFCFD" stroke="#D5DAE0"/>
<text xml:space="preserve" x="390.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">The architecture of your Phase 3 project</text>
<rect x="170" y="62" width="420" height="62" rx="6" fill="#DCEBFA" stroke="#2F6FB0" stroke-width="1.6"/>
<text xml:space="preserve" x="380.0" y="90.25" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1F2933" font-weight="700">HTTP layer</text>
<text xml:space="preserve" x="380.0" y="108.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">routes, JSON, status codes</text>
<line x1="380" y1="124" x2="380" y2="138" stroke="#1F2933" stroke-width="1.8"/>
<polygon points="380.0,138.0 376.1,129.9 383.9,129.9" fill="#1F2933"/>
<rect x="170" y="138" width="420" height="62" rx="6" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="380.0" y="166.25" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1F2933" font-weight="700">Service layer</text>
<text xml:space="preserve" x="380.0" y="184.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">business rules: can this user borrow this book?</text>
<line x1="380" y1="200" x2="380" y2="214" stroke="#1F2933" stroke-width="1.8"/>
<polygon points="380.0,214.0 376.1,205.9 383.9,205.9" fill="#1F2933"/>
<rect x="170" y="214" width="420" height="62" rx="6" fill="#FFF4C2" stroke="#B58900" stroke-width="1.6"/>
<text xml:space="preserve" x="380.0" y="242.25" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1F2933" font-weight="700">Repository layer</text>
<text xml:space="preserve" x="380.0" y="260.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">SQL lives only here</text>
<rect x="170" y="290" width="420" height="40" rx="6" fill="#EEF0F3" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="380.0" y="314.9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">SQLite database, with migrations</text>
<line x1="380" y1="276" x2="380" y2="288" stroke="#1F2933" stroke-width="1.8"/>
<polygon points="380.0,288.0 376.1,279.9 383.9,279.9" fill="#1F2933"/>
<text xml:space="preserve" x="30" y="70" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#2F6FB0" font-weight="700">Docker</text>
<text xml:space="preserve" x="30" y="90" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#5B6672">packages it</text>
<text xml:space="preserve" x="30" y="150" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#2E8B57" font-weight="700">Tests</text>
<text xml:space="preserve" x="30" y="170" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#5B6672">check all layers</text>
<text xml:space="preserve" x="610" y="70" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#7452B8" font-weight="700">CI</text>
<text xml:space="preserve" x="610" y="90" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#5B6672">runs everything</text>
<text xml:space="preserve" x="610" y="108" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#5B6672">on every push</text>
<text xml:space="preserve" x="610" y="150" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#C94343" font-weight="700">Auth</text>
<text xml:space="preserve" x="610" y="170" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#5B6672">tokens, hashed</text>
<text xml:space="preserve" x="610" y="188" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#5B6672">passwords</text>
</svg>
