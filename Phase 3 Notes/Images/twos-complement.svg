<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250">
<rect x="1" y="1" width="758" height="248" rx="12" fill="#FBFCFD" stroke="#D5DAE0"/>
<text xml:space="preserve" x="380.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">Two&#x27;s complement: how computers store negative numbers</text>
<rect x="30" y="66" width="108" height="44" rx="2" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="84.0" y="93.95" font-family="Consolas,Menlo,monospace" font-size="17" text-anchor="middle" fill="#1F2933" font-weight="700">0111</text>
<text xml:space="preserve" x="84" y="134" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#1F2933" font-weight="700">7</text>
<rect x="148" y="66" width="108" height="44" rx="2" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="202.0" y="93.95" font-family="Consolas,Menlo,monospace" font-size="17" text-anchor="middle" fill="#1F2933" font-weight="700">0001</text>
<text xml:space="preserve" x="202" y="134" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#1F2933" font-weight="700">1</text>
<rect x="266" y="66" width="108" height="44" rx="2" fill="#EEF0F3" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="320.0" y="93.95" font-family="Consolas,Menlo,monospace" font-size="17" text-anchor="middle" fill="#1F2933" font-weight="700">0000</text>
<text xml:space="preserve" x="320" y="134" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#1F2933" font-weight="700">0</text>
<rect x="384" y="66" width="108" height="44" rx="2" fill="#FBE0E0" stroke="#C94343" stroke-width="1.6"/>
<text xml:space="preserve" x="438.0" y="93.95" font-family="Consolas,Menlo,monospace" font-size="17" text-anchor="middle" fill="#1F2933" font-weight="700">1111</text>
<text xml:space="preserve" x="438" y="134" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#1F2933" font-weight="700">-1</text>
<rect x="502" y="66" width="108" height="44" rx="2" fill="#FBE0E0" stroke="#C94343" stroke-width="1.6"/>
<text xml:space="preserve" x="556.0" y="93.95" font-family="Consolas,Menlo,monospace" font-size="17" text-anchor="middle" fill="#1F2933" font-weight="700">1110</text>
<text xml:space="preserve" x="556" y="134" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#1F2933" font-weight="700">-2</text>
<rect x="620" y="66" width="108" height="44" rx="2" fill="#FBE0E0" stroke="#C94343" stroke-width="1.6"/>
<text xml:space="preserve" x="674.0" y="93.95" font-family="Consolas,Menlo,monospace" font-size="17" text-anchor="middle" fill="#1F2933" font-weight="700">1000</text>
<text xml:space="preserve" x="674" y="134" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#1F2933" font-weight="700">-8</text>
<text xml:space="preserve" x="380" y="168" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">If the left bit is 1, the number is negative.</text>
<text xml:space="preserve" x="380" y="196" font-family="Consolas,Menlo,monospace" font-size="14" text-anchor="middle" fill="#1F2933">To negate: flip all the bits, then add 1.   5 = 0101 → 1010 → 1011 = -5</text>
<text xml:space="preserve" x="380" y="228" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#5B6672">With 4 bits: -8 to 7.  With 32 bits: about -2.1 billion to 2.1 billion.</text>
</svg>
