<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220">
<rect x="1" y="1" width="758" height="218" rx="12" fill="#FBFCFD" stroke="#D5DAE0"/>
<text xml:space="preserve" x="380.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">Dependency injection: pass in what you need, don&#x27;t build it inside</text>
<text xml:space="preserve" x="190" y="62" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#C94343" font-weight="700">Hard-wired</text>
<rect x="40" y="76" width="300" height="100" rx="6" fill="#FBE0E0" stroke="#C94343" stroke-width="1.6"/>
<text xml:space="preserve" x="60" y="102" font-family="Consolas,Menlo,monospace" font-size="13" text-anchor="start" fill="#1F2933">class Report:</text>
<text xml:space="preserve" x="60" y="128" font-family="Consolas,Menlo,monospace" font-size="13" text-anchor="start" fill="#1F2933">  def __init__(self):</text>
<text xml:space="preserve" x="60" y="154" font-family="Consolas,Menlo,monospace" font-size="13" text-anchor="start" fill="#1F2933">    self.db = RealDb()</text>
<text xml:space="preserve" x="190" y="200" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#C94343">Can&#x27;t test without a real database</text>
<text xml:space="preserve" x="570" y="62" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#2E8B57" font-weight="700">Injected</text>
<rect x="420" y="76" width="300" height="100" rx="6" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="440" y="102" font-family="Consolas,Menlo,monospace" font-size="13" text-anchor="start" fill="#1F2933">class Report:</text>
<text xml:space="preserve" x="440" y="128" font-family="Consolas,Menlo,monospace" font-size="13" text-anchor="start" fill="#1F2933">  def __init__(self, db):</text>
<text xml:space="preserve" x="440" y="154" font-family="Consolas,Menlo,monospace" font-size="13" text-anchor="start" fill="#1F2933">    self.db = db</text>
<text xml:space="preserve" x="570" y="200" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#2E8B57">Tests pass in a fake, production a real one</text>
</svg>
