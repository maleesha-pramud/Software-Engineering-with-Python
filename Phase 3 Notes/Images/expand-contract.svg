<svg xmlns="http://www.w3.org/2000/svg" width="780" height="280" viewBox="0 0 780 280">
<rect x="1" y="1" width="778" height="278" rx="12" fill="#FBFCFD" stroke="#D5DAE0"/>
<text xml:space="preserve" x="390.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">Expand and contract: rename a column with zero downtime</text>
<rect x="20" y="70" width="140" height="76" rx="6" fill="#DCEBFA" stroke="#2F6FB0" stroke-width="1.6"/>
<text xml:space="preserve" x="90.0" y="104.55" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">1. Expand</text>
<text xml:space="preserve" x="90.0" y="123.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">Add new column</text>
<text xml:space="preserve" x="90" y="172" font-family="Consolas,Menlo,monospace" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">old + new</text>
<line x1="160" y1="108" x2="170" y2="108" stroke="#1F2933" stroke-width="1.8"/>
<polygon points="170.0,108.0 161.9,111.9 161.9,104.1" fill="#1F2933"/>
<rect x="170" y="70" width="140" height="76" rx="6" fill="#FDE9D3" stroke="#D97A1E" stroke-width="1.6"/>
<text xml:space="preserve" x="240.0" y="104.55" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">2. Dual write</text>
<text xml:space="preserve" x="240.0" y="123.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">Write to both</text>
<text xml:space="preserve" x="240" y="172" font-family="Consolas,Menlo,monospace" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">old + new</text>
<line x1="310" y1="108" x2="320" y2="108" stroke="#1F2933" stroke-width="1.8"/>
<polygon points="320.0,108.0 311.9,111.9 311.9,104.1" fill="#1F2933"/>
<rect x="320" y="70" width="140" height="76" rx="6" fill="#FDE9D3" stroke="#D97A1E" stroke-width="1.6"/>
<text xml:space="preserve" x="390.0" y="104.55" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">3. Backfill</text>
<text xml:space="preserve" x="390.0" y="123.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">Copy old rows</text>
<text xml:space="preserve" x="390" y="172" font-family="Consolas,Menlo,monospace" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">old + new</text>
<line x1="460" y1="108" x2="470" y2="108" stroke="#1F2933" stroke-width="1.8"/>
<polygon points="470.0,108.0 461.9,111.9 461.9,104.1" fill="#1F2933"/>
<rect x="470" y="70" width="140" height="76" rx="6" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="540.0" y="104.55" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">4. Switch reads</text>
<text xml:space="preserve" x="540.0" y="123.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">Read new column</text>
<text xml:space="preserve" x="540" y="172" font-family="Consolas,Menlo,monospace" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">old + new</text>
<line x1="610" y1="108" x2="620" y2="108" stroke="#1F2933" stroke-width="1.8"/>
<polygon points="620.0,108.0 611.9,111.9 611.9,104.1" fill="#1F2933"/>
<rect x="620" y="70" width="140" height="76" rx="6" fill="#FBE0E0" stroke="#C94343" stroke-width="1.6"/>
<text xml:space="preserve" x="690.0" y="104.55" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">5. Contract</text>
<text xml:space="preserve" x="690.0" y="123.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">Drop old column</text>
<text xml:space="preserve" x="690" y="172" font-family="Consolas,Menlo,monospace" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">new</text>
<text xml:space="preserve" x="390" y="216" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">Every step is safe to deploy alone. Old and new code can run together.</text>
<text xml:space="preserve" x="390" y="244" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#C94343">Only step 5 can&#x27;t be undone, so wait until you&#x27;re sure.</text>
</svg>
