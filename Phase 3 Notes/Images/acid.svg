<svg xmlns="http://www.w3.org/2000/svg" width="780" height="230" viewBox="0 0 780 230">
<rect x="1" y="1" width="778" height="228" rx="12" fill="#FBFCFD" stroke="#D5DAE0"/>
<text xml:space="preserve" x="390.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">ACID in pictures</text>
<rect x="25" y="66" width="174" height="100" rx="6" fill="#DCEBFA" stroke="#2F6FB0" stroke-width="1.6"/>
<text xml:space="preserve" x="112.0" y="113.25" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1F2933" font-weight="700">Atomicity</text>
<text xml:space="preserve" x="112.0" y="131.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">all or nothing</text>
<rect x="211" y="66" width="174" height="100" rx="6" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="298.0" y="113.25" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1F2933" font-weight="700">Consistency</text>
<text xml:space="preserve" x="298.0" y="131.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">rules always hold</text>
<rect x="397" y="66" width="174" height="100" rx="6" fill="#FDE9D3" stroke="#D97A1E" stroke-width="1.6"/>
<text xml:space="preserve" x="484.0" y="113.25" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1F2933" font-weight="700">Isolation</text>
<text xml:space="preserve" x="484.0" y="131.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">transactions don&#x27;t collide</text>
<rect x="583" y="66" width="174" height="100" rx="6" fill="#EAE3F8" stroke="#7452B8" stroke-width="1.6"/>
<text xml:space="preserve" x="670.0" y="113.25" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1F2933" font-weight="700">Durability</text>
<text xml:space="preserve" x="670.0" y="131.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">saved survives a crash</text>
<text xml:space="preserve" x="390" y="200" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933">Together, they let you think of a group of changes as one safe step.</text>
</svg>
