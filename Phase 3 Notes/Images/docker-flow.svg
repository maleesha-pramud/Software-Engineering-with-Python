<svg xmlns="http://www.w3.org/2000/svg" width="780" height="220" viewBox="0 0 780 220">
<rect x="1" y="1" width="778" height="218" rx="12" fill="#FBFCFD" stroke="#D5DAE0"/>
<text xml:space="preserve" x="390.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">From Dockerfile to running container</text>
<rect x="30" y="70" width="190" height="70" rx="6" fill="#FFF4C2" stroke="#B58900" stroke-width="1.6"/>
<text xml:space="preserve" x="125.0" y="102.6" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" text-anchor="middle" fill="#1F2933" font-weight="700">Dockerfile</text>
<text xml:space="preserve" x="125.0" y="120.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">the recipe</text>
<line x1="220" y1="105" x2="290" y2="105" stroke="#1F2933" stroke-width="1.8"/>
<polygon points="290.0,105.0 281.9,108.9 281.9,101.1" fill="#1F2933"/>
<text xml:space="preserve" x="255.0" y="99.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">build</text>
<rect x="290" y="70" width="190" height="70" rx="6" fill="#DCEBFA" stroke="#2F6FB0" stroke-width="1.6"/>
<text xml:space="preserve" x="385.0" y="102.6" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" text-anchor="middle" fill="#1F2933" font-weight="700">Image</text>
<text xml:space="preserve" x="385.0" y="120.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">the frozen package</text>
<line x1="480" y1="105" x2="550" y2="105" stroke="#1F2933" stroke-width="1.8"/>
<polygon points="550.0,105.0 541.9,108.9 541.9,101.1" fill="#1F2933"/>
<text xml:space="preserve" x="515.0" y="99.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">run</text>
<rect x="550" y="70" width="190" height="70" rx="6" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="645.0" y="102.6" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" text-anchor="middle" fill="#1F2933" font-weight="700">Container</text>
<text xml:space="preserve" x="645.0" y="120.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">a running copy</text>
<text xml:space="preserve" x="390" y="178" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933">Like a recipe, a frozen meal, and a served meal. One image can run as many containers.</text>
<text xml:space="preserve" x="390" y="200" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#5B6672">A registry, such as Docker Hub, stores images so that others can pull them.</text>
</svg>
