<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230">
<rect x="1" y="1" width="758" height="228" rx="12" fill="#FBFCFD" stroke="#D5DAE0"/>
<text xml:space="preserve" x="380.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">Keep transactions short: no slow calls inside</text>
<text xml:space="preserve" x="190" y="62" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#C94343" font-weight="700">Bad: holds locks during a network call</text>
<rect x="40" y="76" width="300" height="100" rx="6" fill="#FBE0E0" stroke="#C94343" stroke-width="1.6"/>
<text xml:space="preserve" x="60" y="98" font-family="Consolas,Menlo,monospace" font-size="12.5" text-anchor="start" fill="#1F2933">BEGIN</text>
<text xml:space="preserve" x="60" y="121" font-family="Consolas,Menlo,monospace" font-size="12.5" text-anchor="start" fill="#1F2933">update order</text>
<text xml:space="preserve" x="60" y="144" font-family="Consolas,Menlo,monospace" font-size="12.5" text-anchor="start" fill="#1F2933">call payment API (2 seconds!)</text>
<text xml:space="preserve" x="60" y="167" font-family="Consolas,Menlo,monospace" font-size="12.5" text-anchor="start" fill="#1F2933">COMMIT</text>
<text xml:space="preserve" x="570" y="62" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#2E8B57" font-weight="700">Better: outside the transaction</text>
<rect x="420" y="76" width="300" height="100" rx="6" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="440" y="98" font-family="Consolas,Menlo,monospace" font-size="12.5" text-anchor="start" fill="#1F2933">call payment API</text>
<text xml:space="preserve" x="440" y="121" font-family="Consolas,Menlo,monospace" font-size="12.5" text-anchor="start" fill="#1F2933">BEGIN</text>
<text xml:space="preserve" x="440" y="144" font-family="Consolas,Menlo,monospace" font-size="12.5" text-anchor="start" fill="#1F2933">update order</text>
<text xml:space="preserve" x="440" y="167" font-family="Consolas,Menlo,monospace" font-size="12.5" text-anchor="start" fill="#1F2933">COMMIT</text>
<text xml:space="preserve" x="380" y="206" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933">Other requests wait for your locks, so a slow transaction slows everyone.</text>
</svg>
