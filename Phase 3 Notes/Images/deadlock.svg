<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280">
<rect x="1" y="1" width="718" height="278" rx="12" fill="#FBFCFD" stroke="#D5DAE0"/>
<text xml:space="preserve" x="360.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">Deadlock: each thread holds what the other one needs</text>
<rect x="70" y="110" width="140" height="56" rx="6" fill="#DCEBFA" stroke="#2F6FB0" stroke-width="1.6"/>
<text xml:space="preserve" x="140.0" y="142.9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">Thread A</text>
<rect x="510" y="110" width="140" height="56" rx="6" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="580.0" y="142.9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">Thread B</text>
<rect x="290" y="62" width="140" height="48" rx="6" fill="#FFF4C2" stroke="#B58900" stroke-width="1.6"/>
<text xml:space="preserve" x="360.0" y="90.9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">Lock 1</text>
<rect x="290" y="170" width="140" height="48" rx="6" fill="#FFF4C2" stroke="#B58900" stroke-width="1.6"/>
<text xml:space="preserve" x="360.0" y="198.9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">Lock 2</text>
<line x1="288" y1="86" x2="212" y2="118" stroke="#2E8B57" stroke-width="2.4"/>
<polygon points="212.0,118.0 217.9,111.2 221.0,118.5" fill="#2E8B57"/>
<text xml:space="preserve" x="230" y="88" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#2E8B57" font-weight="700">held by A</text>
<line x1="508" y1="158" x2="432" y2="192" stroke="#2E8B57" stroke-width="2.4"/>
<polygon points="432.0,192.0 437.8,185.1 441.0,192.3" fill="#2E8B57"/>
<text xml:space="preserve" x="495" y="195" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#2E8B57" font-weight="700">held by B</text>
<line x1="212" y1="158" x2="288" y2="192" stroke="#C94343" stroke-width="1.8" stroke-dasharray="5 4"/>
<polygon points="288.0,192.0 279.0,192.3 282.2,185.1" fill="#C94343"/>
<text xml:space="preserve" x="225" y="195" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="end" fill="#C94343" font-weight="700">A wants</text>
<line x1="508" y1="118" x2="432" y2="86" stroke="#C94343" stroke-width="1.8" stroke-dasharray="5 4"/>
<polygon points="432.0,86.0 441.0,85.5 437.9,92.8" fill="#C94343"/>
<text xml:space="preserve" x="495" y="88" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#C94343" font-weight="700">B wants</text>
<text xml:space="preserve" x="360" y="258" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">Fix: always take locks in the same order. Then this circle can&#x27;t form.</text>
</svg>
