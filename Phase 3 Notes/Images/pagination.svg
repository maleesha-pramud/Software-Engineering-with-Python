<text xml:space="preserve" x="190" y="145" font-family="Consolas,Menlo,monospace" font-size="14" text-anchor="middle" fill="#1F2933">?offset=3&amp;limit=3</text>
<text xml:space="preserve" x="190" y="175" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#2E8B57">Simple, and allows jumping to a page</text>
<text xml:space="preserve" x="190" y="197" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#C94343">Slow when deep. Rows shift if data changes</text>
<text xml:space="preserve" x="570" y="62" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">Cursor: start after this row</text>
<rect x="415" y="76" width="52" height="42" rx="2" fill="#DCEBFA" stroke="#2F6FB0" stroke-width="1.6"/>
<text xml:space="preserve" x="441.0" y="102.25" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1F2933" font-weight="700">A</text>
<rect x="467" y="76" width="52" height="42" rx="2" fill="#DCEBFA" stroke="#2F6FB0" stroke-width="1.6"/>
