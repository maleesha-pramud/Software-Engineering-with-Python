<rect x="519" y="76" width="52" height="42" rx="2" fill="#FDE9D3" stroke="#D97A1E" stroke-width="1.6"/>
<text xml:space="preserve" x="545.0" y="102.25" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1F2933" font-weight="700">C</text>
<rect x="571" y="76" width="52" height="42" rx="2" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="597.0" y="102.25" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1F2933" font-weight="700">D</text>
<rect x="623" y="76" width="52" height="42" rx="2" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="649.0" y="102.25" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1F2933" font-weight="700">E</text>
<rect x="675" y="76" width="52" height="42" rx="2" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="701.0" y="102.25" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1F2933" font-weight="700">F</text>
<text xml:space="preserve" x="570" y="145" font-family="Consolas,Menlo,monospace" font-size="14" text-anchor="middle" fill="#1F2933">?after=C&amp;limit=3</text>
<text xml:space="preserve" x="570" y="175" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#2E8B57">Fast and stable at any depth</text>
<text xml:space="preserve" x="570" y="197" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#C94343">You can&#x27;t jump straight to page 50</text>
<text xml:space="preserve" x="380" y="250" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">Use offset for small admin lists. Use cursor for feeds and large data.</text>
</svg>
