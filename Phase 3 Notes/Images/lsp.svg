<text xml:space="preserve" x="300" y="95" font-family="Consolas,Menlo,monospace" font-size="13" text-anchor="start" fill="#1F2933">set_width(5), set_height(2)</text>
<text xml:space="preserve" x="300" y="122" font-family="Consolas,Menlo,monospace" font-size="13" text-anchor="start" fill="#2E8B57">code expects area() == 10</text>
