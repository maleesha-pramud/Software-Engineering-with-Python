<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
<rect x="1" y="1" width="758" height="298" rx="12" fill="#FBFCFD" stroke="#D5DAE0"/>
<text xml:space="preserve" x="380.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">Processes have separate memory. Threads share it.</text>
<text xml:space="preserve" x="190" y="60" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">Two processes</text>
<rect x="30" y="72" width="155" height="170" rx="6" fill="#DCEBFA" stroke="#2F6FB0" stroke-width="1.6"/>
<text xml:space="preserve" x="107" y="94" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">Process A</text>
<rect x="45" y="106" width="125" height="60" rx="6" fill="#FFFFFF" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="107.5" y="140.55" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933">own memory</text>
<rect x="45" y="176" width="125" height="50" rx="6" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="107.5" y="205.55" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">one thread</text>
<rect x="200" y="72" width="155" height="170" rx="6" fill="#DCEBFA" stroke="#2F6FB0" stroke-width="1.6"/>
<text xml:space="preserve" x="277" y="94" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">Process B</text>
<rect x="215" y="106" width="125" height="60" rx="6" fill="#FFFFFF" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="277.5" y="140.55" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933">own memory</text>
<rect x="215" y="176" width="125" height="50" rx="6" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="277.5" y="205.55" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">one thread</text>
<text xml:space="preserve" x="190" y="262" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#5B6672">Safe, but slower to create and to talk</text>
<text xml:space="preserve" x="570" y="60" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">One process, three threads</text>
<rect x="400" y="72" width="340" height="170" rx="6" fill="#DCEBFA" stroke="#2F6FB0" stroke-width="1.6"/>
<rect x="415" y="84" width="310" height="60" rx="6" fill="#FFFFFF" stroke="#77808C" stroke-width="1.6"/>
<text xml:space="preserve" x="570.0" y="118.55" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">shared memory (heap, globals)</text>
<rect x="415" y="160" width="98" height="68" rx="6" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="464.0" y="190.2" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="700">Thread 1</text>
<text xml:space="preserve" x="464.0" y="209.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">own stack</text>
<line x1="464" y1="160" x2="464" y2="146" stroke="#D97A1E" stroke-width="2.4"/>
<polygon points="464.0,146.0 467.9,154.1 460.1,154.1" fill="#D97A1E"/>
<rect x="521" y="160" width="98" height="68" rx="6" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="570.0" y="190.2" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="700">Thread 2</text>
<text xml:space="preserve" x="570.0" y="209.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">own stack</text>
<line x1="570" y1="160" x2="570" y2="146" stroke="#D97A1E" stroke-width="2.4"/>
<polygon points="570.0,146.0 573.9,154.1 566.1,154.1" fill="#D97A1E"/>
<rect x="627" y="160" width="98" height="68" rx="6" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="676.0" y="190.2" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="700">Thread 3</text>
<text xml:space="preserve" x="676.0" y="209.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672">own stack</text>
<line x1="676" y1="160" x2="676" y2="146" stroke="#D97A1E" stroke-width="2.4"/>
<polygon points="676.0,146.0 679.9,154.1 672.1,154.1" fill="#D97A1E"/>
<text xml:space="preserve" x="570" y="262" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#5B6672">Fast, but they can step on each other</text>
</svg>
