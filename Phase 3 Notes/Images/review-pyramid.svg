<text xml:space="preserve" x="370.0" y="288.55" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933" font-weight="700">Correctness and security: does it work, and is it safe?</text>
<text xml:space="preserve" x="370" y="332" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">Spend your attention at the bottom. Automate the top.</text>
