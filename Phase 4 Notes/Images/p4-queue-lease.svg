<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300">
<rect x="1" y="1" width="818" height="298" rx="12" fill="#FBFCFD" stroke="#D5DAE0"/>
<text xml:space="preserve" x="410.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">A durable queue: take, work, ack. No ack means it comes back</text>
<rect x="30" y="100" width="140" height="70" rx="8" fill="#DCEBFA" stroke="#2F6FB0" stroke-width="1.6"/>
<text xml:space="preserve" x="100.0" y="130.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="700">Borrow request</text>
<text xml:space="preserve" x="100.0" y="148.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="400">adds a job: 3 ms</text>
<rect x="260" y="80" width="190" height="110" rx="8" fill="#FDE9D3" stroke="#D97A1E" stroke-width="1.6"/>
<text xml:space="preserve" x="355.0" y="121.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="700">Queue (a file)</text>
<text xml:space="preserve" x="355.0" y="139.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="400">ready · running</text>
<text xml:space="preserve" x="355.0" y="157.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="400">done · dead</text>
<rect x="550" y="100" width="150" height="70" rx="8" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="625.0" y="130.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="700">Worker</text>
<text xml:space="preserve" x="625.0" y="148.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="400">sends the email</text>
<line x1="170" y1="135" x2="258" y2="135" stroke="#5B6672" stroke-width="1.8"/>
<polygon points="258,135 249.7,138.5 249.7,131.5" fill="#5B6672"/>
<text xml:space="preserve" x="214" y="124" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672" font-weight="700">put</text>
<line x1="450" y1="120" x2="548" y2="120" stroke="#5B6672" stroke-width="1.8"/>
<polygon points="548,120 539.7,123.5 539.7,116.5" fill="#5B6672"/>
<text xml:space="preserve" x="500" y="110" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672" font-weight="700">take</text>
<line x1="548" y1="150" x2="452" y2="150" stroke="#5B6672" stroke-width="1.8"/>
<polygon points="452,150 460.3,146.5 460.3,153.5" fill="#5B6672"/>
<text xml:space="preserve" x="500" y="168" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#2E8B57" font-weight="700">ack</text>
<rect x="550" y="215" width="150" height="50" rx="8" fill="#FBE0E0" stroke="#C94343" stroke-width="1.6"/>
<text xml:space="preserve" x="625.0" y="235.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#1F2933" font-weight="700">Worker crashes</text>
<text xml:space="preserve" x="625.0" y="253.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5B6672" font-weight="400">no ack</text>
<line x1="550" y1="240" x2="350" y2="196" stroke="#C94343" stroke-width="1.8" stroke-dasharray="6 5"/>
<polygon points="350,196 358.8,194.4 357.3,201.2" fill="#C94343"/>
<text xml:space="preserve" x="410" y="240" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#C94343" font-weight="700">lease runs out: job returns</text>
<text xml:space="preserve" x="410.0" y="288" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#5B6672" font-weight="400">Because a job can arrive twice, the worker must be safe to repeat (idempotent).</text>
</svg>