<text xml:space="preserve" x="412.0" y="136.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="400">Numbers over time</text>
<text xml:space="preserve" x="412.0" y="154.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="400">counts, averages, max</text>
