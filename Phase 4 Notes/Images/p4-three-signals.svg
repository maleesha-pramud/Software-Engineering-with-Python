<text xml:space="preserve" x="150.0" y="136.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="400">One JSON line per event</text>
<text xml:space="preserve" x="150.0" y="154.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="400">request_id on every line</text>
<text xml:space="preserve" x="150.0" y="172.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="400">Answers: what happened?</text>
