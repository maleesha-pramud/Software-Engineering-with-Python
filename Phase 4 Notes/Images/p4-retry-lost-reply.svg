<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300">
<rect x="1" y="1" width="818" height="298" rx="12" fill="#FBFCFD" stroke="#D5DAE0"/>
<text xml:space="preserve" x="410.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">A lost reply looks exactly like a lost request</text>
<rect x="40" y="90" width="150" height="80" rx="8" fill="#DCEBFA" stroke="#2F6FB0" stroke-width="1.6"/>
<text xml:space="preserve" x="115.0" y="125.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="700">Phone</text>
<text xml:space="preserve" x="115.0" y="143.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="400">taps Borrow once</text>
<rect x="330" y="90" width="150" height="80" rx="8" fill="#FDE9D3" stroke="#D97A1E" stroke-width="1.6"/>
<text xml:space="preserve" x="405.0" y="125.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="700">Bad network</text>
<text xml:space="preserve" x="405.0" y="143.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="400">loses the reply</text>
<rect x="620" y="90" width="150" height="80" rx="8" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="695.0" y="125.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="700">Pagebound</text>
<text xml:space="preserve" x="695.0" y="143.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="400">borrowed the book</text>
<line x1="190" y1="115" x2="328" y2="115" stroke="#5B6672" stroke-width="1.8"/>
<polygon points="328,115 319.7,118.5 319.7,111.5" fill="#5B6672"/>
<line x1="480" y1="115" x2="618" y2="115" stroke="#5B6672" stroke-width="1.8"/>
<polygon points="618,115 609.7,118.5 609.7,111.5" fill="#5B6672"/>
<line x1="618" y1="148" x2="482" y2="148" stroke="#C94343" stroke-width="1.8" stroke-dasharray="6 5"/>
<polygon points="482,148 490.3,144.5 490.3,151.5" fill="#C94343"/>
<text xml:space="preserve" x="550" y="170" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#C94343" font-weight="700">reply lost</text>
<line x1="330" y1="160" x2="192" y2="160" stroke="#C94343" stroke-width="1.8" stroke-dasharray="6 5"/>
<polygon points="192,160 200.3,156.5 200.3,163.5" fill="#C94343"/>
<text xml:space="preserve" x="262" y="186" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#C94343" font-weight="700">no answer: retry!</text>
<text xml:space="preserve" x="410.0" y="232" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#C94343" font-weight="700">Without a key, the retry borrows a SECOND copy.</text>
<text xml:space="preserve" x="410.0" y="256" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#2E8B57" font-weight="700">With an Idempotency-Key, the server sees the same key and replays the first answer.</text>
</svg>