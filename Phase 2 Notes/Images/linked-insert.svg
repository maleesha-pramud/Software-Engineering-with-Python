<text xml:space="preserve" x="340.0" y="85.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="700">old arrow: remove</text>
<rect x="300" y="185" width="80" height="46" rx="6" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
