<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300">
<rect x="1" y="1" width="778" height="298" rx="12" fill="#FBFCFD" stroke="#D5DAE0"/>
<text xml:space="preserve" x="390.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">An HTTP request and response are just text</text>
<text xml:space="preserve" x="205" y="60" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#2F6FB0" font-weight="700">Request</text>
<text xml:space="preserve" x="585" y="60" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#2E8B57" font-weight="700">Response</text>
<rect x="25" y="74" width="350" height="190" rx="6" fill="#DCEBFA" stroke="#2F6FB0" stroke-width="1.6"/>
<text xml:space="preserve" x="37" y="100" font-family="Consolas,Menlo,monospace" font-size="12.5" text-anchor="start" fill="#1F2933" font-weight="700">GET /books/42 HTTP/1.1</text>
<text xml:space="preserve" x="365" y="114" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="end" fill="#5B6672">method, path, version</text>
<text xml:space="preserve" x="37" y="136" font-family="Consolas,Menlo,monospace" font-size="12.5" text-anchor="start" fill="#1F2933">Host: example.com</text>
<text xml:space="preserve" x="365" y="150" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="end" fill="#5B6672">headers</text>
<text xml:space="preserve" x="37" y="172" font-family="Consolas,Menlo,monospace" font-size="12.5" text-anchor="start" fill="#1F2933">Accept: application/json</text>
<text xml:space="preserve" x="365" y="186" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="end" fill="#5B6672"></text>
<text xml:space="preserve" x="37" y="208" font-family="Consolas,Menlo,monospace" font-size="12.5" text-anchor="start" fill="#1F2933"></text>
<text xml:space="preserve" x="365" y="222" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="end" fill="#5B6672">blank line</text>
<text xml:space="preserve" x="37" y="244" font-family="Consolas,Menlo,monospace" font-size="12.5" text-anchor="start" fill="#1F2933">(no body for GET)</text>
<text xml:space="preserve" x="365" y="258" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="end" fill="#5B6672">body</text>
<rect x="405" y="74" width="350" height="190" rx="6" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="417" y="100" font-family="Consolas,Menlo,monospace" font-size="12.5" text-anchor="start" fill="#1F2933" font-weight="700">HTTP/1.1 200 OK</text>
<text xml:space="preserve" x="745" y="114" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="end" fill="#5B6672">version, status code</text>
<text xml:space="preserve" x="417" y="136" font-family="Consolas,Menlo,monospace" font-size="12.5" text-anchor="start" fill="#1F2933">Content-Type: application/json</text>
<text xml:space="preserve" x="745" y="150" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="end" fill="#5B6672">headers</text>
<text xml:space="preserve" x="417" y="172" font-family="Consolas,Menlo,monospace" font-size="12.5" text-anchor="start" fill="#1F2933">Content-Length: 21</text>
<text xml:space="preserve" x="745" y="186" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="end" fill="#5B6672"></text>
<text xml:space="preserve" x="417" y="208" font-family="Consolas,Menlo,monospace" font-size="12.5" text-anchor="start" fill="#1F2933"></text>
<text xml:space="preserve" x="745" y="222" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="end" fill="#5B6672">blank line</text>
<text xml:space="preserve" x="417" y="244" font-family="Consolas,Menlo,monospace" font-size="12.5" text-anchor="start" fill="#1F2933">{&quot;title&quot;: &quot;SQL Fun&quot;}</text>
<text xml:space="preserve" x="745" y="258" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="end" fill="#5B6672">body</text>
</svg>
