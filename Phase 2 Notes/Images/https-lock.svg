<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220">
<rect x="1" y="1" width="758" height="218" rx="12" fill="#FBFCFD" stroke="#D5DAE0"/>
<text xml:space="preserve" x="380.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">HTTP vs HTTPS: postcard vs locked box</text>
<text xml:space="preserve" x="190" y="62" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#C94343" font-weight="700">HTTP: anyone on the way can read it</text>
<rect x="40" y="85" width="90" height="44" rx="6" fill="#DCEBFA" stroke="#2F6FB0" stroke-width="1.6"/>
<text xml:space="preserve" x="85.0" y="111.9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">You</text>
<rect x="250" y="85" width="90" height="44" rx="6" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="295.0" y="111.9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">Server</text>
<line x1="130" y1="107" x2="250" y2="107" stroke="#5B6672" stroke-width="1.8"/>
<polygon points="250.0,107.0 241.9,110.9 241.9,103.1" fill="#5B6672"/>
<rect x="145" y="70" width="90" height="28" rx="6" fill="#FBE0E0" stroke="#C94343" stroke-width="1.6"/>
<text xml:space="preserve" x="190.0" y="87.325" font-family="Consolas,Menlo,monospace" font-size="9.5" text-anchor="middle" fill="#1F2933">password=abc</text>
<circle cx="190" cy="160" r="18" fill="#FBE0E0" stroke="#C94343" stroke-width="1.8"/>
<text xml:space="preserve" x="190" y="164.9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">?</text>
<text xml:space="preserve" x="190" y="196" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#C94343">someone listening reads it</text>
<line x1="190" y1="142" x2="190" y2="112" stroke="#C94343" stroke-width="1.8" stroke-dasharray="5 4"/>
<polygon points="190.0,112.0 193.9,120.1 186.1,120.1" fill="#C94343"/>
<text xml:space="preserve" x="570" y="62" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#2E8B57" font-weight="700">HTTPS: encrypted, so it looks like noise</text>
<rect x="420" y="85" width="90" height="44" rx="6" fill="#DCEBFA" stroke="#2F6FB0" stroke-width="1.6"/>
<text xml:space="preserve" x="465.0" y="111.9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">You</text>
<rect x="630" y="85" width="90" height="44" rx="6" fill="#DDF3E4" stroke="#2E8B57" stroke-width="1.6"/>
<text xml:space="preserve" x="675.0" y="111.9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">Server</text>
<line x1="510" y1="107" x2="630" y2="107" stroke="#2E8B57" stroke-width="2.6"/>
<polygon points="630.0,107.0 621.9,110.9 621.9,103.1" fill="#2E8B57"/>
