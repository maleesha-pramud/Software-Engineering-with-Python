<text xml:space="preserve" x="570.0" y="87.85" font-family="Consolas,Menlo,monospace" font-size="11" text-anchor="middle" fill="#1F2933">x8#Kq!2z@</text>
<circle cx="570" cy="160" r="18" fill="#EEF0F3" stroke="#77808C" stroke-width="1.8"/>
<text xml:space="preserve" x="570" y="164.9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1F2933" font-weight="700">?</text>
<text xml:space="preserve" x="570" y="196" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#5B6672">listener sees only scrambled bytes</text>
