<svg xmlns="http://www.w3.org/2000/svg" width="780" height="180" viewBox="0 0 780 180">
<rect x="1" y="1" width="778" height="178" rx="12" fill="#FBFCFD" stroke="#D5DAE0"/>
<text xml:space="preserve" x="390.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1F2933" font-weight="700">HTTP status codes: the first digit tells the story</text>
