<text xml:space="preserve" x="392" y="122" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="700">Go elsewhere</text>
<text xml:space="preserve" x="392" y="144" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#5B6672">301, 304</text>
