<text xml:space="preserve" x="242" y="122" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="700">Success</text>
<text xml:space="preserve" x="242" y="144" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#5B6672">200, 201</text>
