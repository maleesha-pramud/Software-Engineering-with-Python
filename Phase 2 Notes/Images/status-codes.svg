<text xml:space="preserve" x="92" y="122" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1F2933" font-weight="700">Wait</text>
<text xml:space="preserve" x="92" y="144" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#5B6672">101</text>
