<text xml:space="preserve" x="190" y="150" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1F2933">Lost pieces are sent again.</text>
<text xml:space="preserve" x="190" y="172" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#5B6672">Web pages, email, files</text>
